<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Carattere&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style4.css">
</head>
<body>

    <!-- Background -->
    <div class="background">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
    </div>

    <div class="container">
        <h1 class="page-title">Our Moments</h1>
        <p class="page-subtitle">Special Photos</p>

        <!-- Grid 4 Foto -->
        <div class="gallery-grid">
            <div class="photo-card">
                <div class="photo-wrapper">
                    <img src="images/photo1.jfif" alt="Photo 1" class="photo">
                </div>
                <p class="photo-caption">First Memory</p>
            </div>

            <div class="photo-card">
                <div class="photo-wrapper">
                    <img src="images/photo2.jfif" alt="Photo 2" class="photo">
                </div>
                <p class="photo-caption">Beautiful Day</p>
            </div>

            <div class="photo-card">
                <div class="photo-wrapper">
                    <img src="images/photo3.jfif" alt="Photo 3" class="photo">
                </div>
                <p class="photo-caption">Together</p>
            </div>

            <div class="photo-card">
                <div class="photo-wrapper">
                    <img src="images/photo4.jfif" alt="Photo 4" class="photo">
                </div>
                <p class="photo-caption">Forever</p>
            </div>
        </div>

        <!-- Tombol navigasi -->
        <a href="index3.html" class="back-button" aria-label="Kembali">
            <span class="arrow">↩</span>
        </a>
        <a href="index5.html" class="next-button" aria-label="Lanjut">
            <span class="arrow">↪</span>
        </a>
    </div>

    <!-- Modal Preview -->
    <div class="modal" id="photoModal">
        <span class="modal-close" id="modalClose">✕</span>
        <img class="modal-content" id="modalImg">
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <script>
        // Modal untuk preview foto
        const modal = document.getElementById('photoModal');
        const modalImg = document.getElementById('modalImg');
        const modalCaption = document.getElementById('modalCaption');
        const modalClose = document.getElementById('modalClose');

        // Semua foto
        const photos = document.querySelectorAll('.photo');
        const captions = document.querySelectorAll('.photo-caption');

        photos.forEach((photo, index) => {
            photo.addEventListener('click', function() {
                modal.style.display = 'flex';
                modalImg.src = this.src;
                modalCaption.textContent = captions[index].textContent;
            });
        });

        // Tutup modal
        modalClose.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        modal.addEventListener('click', function(e) {
            if (e.target === this) {
                modal.style.display = 'none';
            }
        });
    </script>

</body>
</html>
